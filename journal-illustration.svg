<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t">
  <title id="t">Une tasse fumante posée près d'un carnet</title>
  <style>
    .ink { fill: none; stroke: #2C2520; stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
    .soft { stroke: #2C2520; opacity: .55; }
    .accent { stroke: #9C6B43; }
    .steam path {
      fill: none; stroke: #2C2520; stroke-width: 1.1; stroke-linecap: round; opacity: 0;
      stroke-dasharray: 90 90;
      animation: rise 4.2s ease-in-out infinite;
    }
    .steam path:nth-child(2) { animation-delay: 1.4s; }
    .steam path:nth-child(3) { animation-delay: 2.8s; }
    @keyframes rise {
      0%   { opacity: 0;   stroke-dashoffset: 90;  transform: translate(0, 6px); }
      30%  { opacity: .8; }
      65%  { opacity: .55; }
      100% { opacity: 0;   stroke-dashoffset: -90; transform: translate(2px, -14px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .steam path { animation: none; opacity: .5; stroke-dashoffset: 0; }
    }
  </style>

  <!-- ligne de table -->
  <path class="ink" d="M14 204 C70 202.5 120 204.5 176 203 C226 202 272 204.5 308 203"/>
  <path class="ink soft" d="M40 209 C60 208.5 74 209.3 92 208.8"/>

  <!-- carnet fermé, vu légèrement de biais -->
  <path class="ink" d="M34 196 L70 160.5 C104 160 136 160.8 168 160.2 L136 196.4 C102 196.9 68 196.2 34 196 Z"/>
  <path class="ink" d="M34 196 L34.4 201.6 C68 202.1 102 202.6 136.2 202 L136 196.4"/>
  <path class="ink" d="M136.2 202 L168.3 165.6 L168 160.2"/>
  <!-- élastique -->
  <path class="ink soft" d="M148 160.4 L117 196.4"/>
  <!-- petit soleil sur la couverture -->
  <path class="ink accent" d="M101 172.5 C106 172 109.6 175.8 109.2 180 C108.8 184.4 104.8 187.4 100.2 187 C95.8 186.5 92.6 182.8 93 178.6 C93.4 174.8 96.8 172.7 101 172.5"/>
  <circle cx="101.1" cy="179.8" r="1.6" fill="#9C6B43"/>
  <!-- crayon posé -->
  <path class="ink" d="M58 214 L150 186.5 L152.4 192 L60.6 219.4 Z"/>
  <path class="ink" d="M58 214 L48.5 218.7 L60.6 219.4"/>
  <path class="ink" d="M141 189.2 L143.5 194.8"/>

  <!-- soucoupe -->
  <path class="ink" d="M190 196.5 C206 205.5 268 206 286 196.2"/>
  <path class="ink" d="M184 193.6 C200 199.6 274 200.4 292 193 C295 190.6 290.5 188.4 284 188"/>
  <path class="ink" d="M184 193.6 C182.6 191.6 186 189.4 193 188.4"/>
  <!-- tasse -->
  <g transform="translate(0 5.5)">
  <path class="ink" d="M198 128.6 C198.4 154 202 174.5 214.6 184 C224 190.4 252 190.6 262.4 183.6 C274.8 174.8 278.2 154.2 278.4 128.8"/>
  <path class="ink" d="M198 128.6 C212 123.4 264 123.2 278.4 128.8 C264.6 134.2 212.4 134.4 198 128.6 Z"/>
  <path class="ink soft" d="M206 131.6 C222 134.6 254 134.8 270.6 131.8"/>
  <!-- anse -->
  <path class="ink" d="M277.6 141.4 C293.6 137.6 300.2 151.4 293.4 161.6 C289.2 167.6 281.4 169 274.6 166.6"/>
  <path class="ink soft" d="M277.2 148.2 C286.4 146.4 289.4 154.4 285.2 159.4 C282.8 162 279.4 162.4 276.2 161.4"/>

  </g>

  <!-- vapeur animée -->
  <g class="steam" transform="translate(0 5.5)">
    <path d="M222 116 C214 104 230 96 222 82 C216 72 226 64 222 54"/>
    <path d="M238 114 C230 100 248 92 238 76 C232 66 244 58 240 46"/>
    <path d="M254 116 C246 104 262 96 254 84 C249 76 258 68 255 60"/>
  </g>
</svg>
